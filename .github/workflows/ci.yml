name: CI

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: ranobe
                    POSTGRES_PASSWORD: ranobe
                    POSTGRES_DB: ranobe
                ports: ["5432:5432"]
                options: --health-cmd "pg_isready -U ranobe" --health-interval 5s --health-retries 10
        env:
            DATABASE_URL: postgres://ranobe:ranobe@localhost:5432/ranobe
            APP_SECRET: ci-secret-0123456789abcdef
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm typecheck
            - run: pnpm test
            - run: pnpm build

    image:
        needs: test
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # a release tag v1.2.3 → :1.2.3, :1.2, :1 and :latest; main → :edge
            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/ranobe-tl
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
                      type=edge,branch=main
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # A GitHub release with a compose.yml pinned to this version, for:
    #   curl -fsSLO https://github.com/<owner>/ranobe-tl/releases/latest/download/compose.yml
    release:
        needs: image
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - name: Pin the image in compose.yml
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
                  mkdir release
                  sed -e "s|ghcr.io/veiag/ranobe-tl:\${RANOBE_TL_VERSION:-latest}|ghcr.io/$owner/ranobe-tl:\${RANOBE_TL_VERSION:-$version}|" compose.yml > release/compose.yml
                  grep -q "ranobe-tl:\${RANOBE_TL_VERSION:-$version}" release/compose.yml
                  cp .env.example release/env.example
            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  prerelease=""
                  case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
                  gh release create "$GITHUB_REF_NAME" release/compose.yml release/env.example \
                      --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
